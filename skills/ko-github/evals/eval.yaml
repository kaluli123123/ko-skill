schema_version: v1alpha1

# ko-github eval suite (skill-up)
# Run: skill-up validate skills/ko-github/evals/eval.yaml

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code

cases:
  files:
    - evals/cases/should-trigger-new-feature.yaml
    - evals/cases/should-skip-small-fix.yaml
    - evals/cases/asks-for-missing-context.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 30

report:
  formats: [json]
