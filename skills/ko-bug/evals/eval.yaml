schema_version: v1alpha1

# ko-bug eval suite (skill-up)
# Run: skill-up validate skills/ko-bug/evals/eval.yaml
#      skill-up run      skills/ko-bug/evals/eval.yaml            # default claude_code engine
#      skill-up run      skills/ko-bug/evals/eval.yaml --engine codex

environment:
  type: none                      # cases only need local python3 and git; no remote sandbox required

skills:
  - source: local_path
    path: .                       # root of the skill under test (contains SKILL.md)

engine:
  name: claude_code               # claude_code | codex; override with --engine
  # model omitted, uses the engine's default model

cases:
  files:
    - evals/cases/has-failing-test.yaml
    - evals/cases/no-seam-hitl.yaml
    - evals/cases/should-not-trigger-feature.yaml
  defaults:
    timeout_seconds: 900
    max_turns: 30
    expect:
      must_not_contain:
        - "I cannot"

report:
  formats: [json]
