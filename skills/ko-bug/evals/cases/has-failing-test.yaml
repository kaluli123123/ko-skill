id: has-failing-test
title: 已有 failing test 时复用为反馈循环，并在分析确认门前停下、不改生产代码
description: |
  锁定审核修复 2 与 3：阶段 2 直接把现成 failing test 当反馈循环，阶段 6 复用而不是重建；
  分析确认门只发一次且必须等用户确认——单轮对话里没有用户确认，生产文件必须保持原样。

input:
  prompt: |
    使用 $ko-bug：`python3 -m unittest test_slugify -v` 里 `test_trailing_hyphen` 失败了，
    帮我按流程处理。

context:
  files:
    "slugify.py": |
      import re


      def slugify(text: str) -> str:
          """标题转 URL slug：小写、非字母数字合并成连字符、去掉首尾连字符。"""
          slug = re.sub(r"[^a-z0-9]+", "-", text.lower())
          return slug.lstrip("-")
    "test_slugify.py": |
      import unittest

      from slugify import slugify


      class SlugifyTest(unittest.TestCase):
          def test_basic(self):
              self.assertEqual(slugify("Hello World"), "hello-world")

          def test_leading_hyphen(self):
              self.assertEqual(slugify("  Hello"), "hello")

          def test_trailing_hyphen(self):
              self.assertEqual(slugify("Hello World!"), "hello-world")


      if __name__ == "__main__":
          unittest.main()

constraints:
  timeout_seconds: 900
  max_turns: 30

expect:                              # 零成本门槛：报告里必须提到那条失败测试和假设
  must_contain:
    - "test_trailing_hyphen"
    - "假设"

judge:
  type: script                       # 精确判定：生产文件未被改动 + 报告停在确认门
  script_path: evals/fixtures/scripts/check-gate.sh
  timeout_seconds: 30
