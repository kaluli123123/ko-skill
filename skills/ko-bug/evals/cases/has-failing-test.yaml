id: has-failing-test
title: Reuses an existing failing test as the feedback loop, and stops at the confirmation gate without touching production code
description: |
  Locks in fixes 2 and 3 from the audit: Stage 2 treats an existing failing test as the
  feedback loop directly, and Stage 6 reuses it instead of rebuilding one; the analysis
  confirmation gate is sent once and must wait for the user — in a single-turn conversation
  there is no user confirmation yet, so production files must stay untouched.
  Uses an English-language bug report to exercise the default branch of the Language Policy.

input:
  prompt: |
    Use $ko-bug: `python3 -m unittest test_slugify -v` — the `test_trailing_hyphen` test is
    failing. Please handle it following the protocol.

context:
  files:
    "slugify.py": |
      import re


      def slugify(text: str) -> str:
          """Turn a title into a URL slug: lowercase, collapse runs of non-alphanumeric
          characters into a single hyphen, and strip leading/trailing hyphens."""
          slug = re.sub(r"[^a-z0-9]+", "-", text.lower())
          return slug.lstrip("-")
    "test_slugify.py": |
      import unittest

      from slugify import slugify


      class SlugifyTest(unittest.TestCase):
          def test_basic(self):
              self.assertEqual(slugify("Hello World"), "hello-world")

          def test_leading_hyphen(self):
              self.assertEqual(slugify("  Hello"), "hello")

          def test_trailing_hyphen(self):
              self.assertEqual(slugify("Hello World!"), "hello-world")


      if __name__ == "__main__":
          unittest.main()

constraints:
  timeout_seconds: 900
  max_turns: 30

judge:
  type: script                       # precise check: production file untouched + report stops at the gate + English response
  script_path: evals/fixtures/scripts/check-gate.sh
  timeout_seconds: 30
