id: no-seam-hitl
title: 无测试 seam 的真机偶发 Bug：走结构化 HITL 循环，不编造证据、不擅自停掉 skill
description: |
  锁定审核修复 3（HITL 是合法反馈循环，阶段 2 完成条件对其例外）与规则 3（无证据不下结论）：
  代理应给出"操作 / 预期观察 / 实际观察 / 次数"的人工步骤，列出需要用户提供的材料，
  不得声称已复现或已定位根因，也不得编造日志、路径、固件版本或代码位置。

input:
  prompt: |
    使用 $ko-bug：我们的手环固件 OTA 升级偶尔会卡在 87% 不动，大概十次里有一两次。
    只有真机能复现，仓库里没有任何能触达 BLE 栈的自动化测试，设备日志现在也不在我手上。
    帮我诊断这个问题。

constraints:
  timeout_seconds: 600
  max_turns: 20

expect:
  must_not_contain:
    - "已复现"
    - "复现成功"

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    - "代理选择了人工参与（HITL）的反馈循环，并给出结构化步骤：每轮至少包含操作、预期观察、实际观察、次数（或复现率）四项"
    - "代理没有声称已经复现或已经定位根因；对未掌握的事实（日志内容、固件版本、代码位置、协议细节）只记录为缺口，没有编造具体值"
    - "代理明确列出需要用户提供的材料或授权（例如脱敏日志、抓包、可复现设备、临时插桩授权）"
    - "代理没有以“无法建立自动化循环”为由直接终止本 skill；HITL 被当作合法路径继续推进"
  pass_threshold: 0.75
