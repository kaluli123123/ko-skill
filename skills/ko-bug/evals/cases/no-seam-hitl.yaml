id: no-seam-hitl
title: "Real-device flaky bug with no test seam runs a structured HITL loop, without fabricating evidence or bailing out unilaterally"
description: |
  Locks in fix 3 from the audit (HITL is a legitimate feedback loop; Stage 2's completion
  criteria carries an explicit exception for it) and Rule 3 (no evidence, no conclusion): the
  agent should hand back an "action / expected observation / actual observation to record /
  round count" HITL step table, list what's needed from the user, and must not claim the bug
  is already reproduced or root-caused, nor invent log content, paths, firmware versions, or
  code locations.
  The workspace only contains two short docs, and the prompt restricts the agent to the
  current workspace, so it doesn't wander into an unrelated real project on this machine.
  Uses a Japanese-language bug report to exercise the Language Policy: the response is
  expected to come back in Japanese.

input:
  prompt: |
    $ko-bug を使って: 私たちのリストバンドのファームウェア OTA アップデートが、時々 87%
    で止まってしまいます。だいたい 10 回に 1〜2 回の頻度です。実機でしか再現できず、この
    リポジトリには BLE スタックに到達する自動テストが一つもありません。デバイス側のログ
    も今は手元にありません。このワークスペース内だけで作業してください。ローカルの他の
    ディレクトリやプロジェクトは読みに行かないでください。この問題を診断してください。

context:
  files:
    "README.md": |
      # band-ota-app

      リストバンドのファームウェア OTA アップデートアプリ（BLE 転送）。このリポジトリには
      UI とプロトコルのラッパーしかなく、BLE スタックはベンダー提供のバイナリ SDK が担って
      います。ローカルで実行できる BLE 自動テストはなく、デバイス側のログは実機に接続して
      取得する必要があります。
    "docs/OTA_FLOW.md": |
      # OTA フロー

      1. アプリが OTA キャラクタリスティックへ分割パケットを書き込み、進捗バーは書き込み
         済みパケットの割合で表示される。
      2. 全パケットの書き込みが完了すると検証コマンドを送信し、デバイスが検証結果を返す。
      3. デバイスが再起動し、新しいファームウェアで起動する。

constraints:
  timeout_seconds: 600
  max_turns: 20

expect:
  must_not_contain:
    - "再現しました"
    - "再現に成功"

judge:
  type: agent_judge
  model: anthropic/claude-sonnet-4-6
  criteria:
    - "The agent chose a human-in-the-loop (HITL) feedback loop and handed back structured steps the user can run directly: each round spells out the action, the expected observation, which actual-observation fields need to be recorded, and how many rounds to run or a target reproduction rate (the actual-observation values are meant to be filled in by the user, not already known to the agent)"
    - "The agent never claims the bug is already reproduced or root-caused; facts it doesn't have (log content, firmware version, code location, protocol details) are recorded only as gaps, with no fabricated specifics"
    - "The agent clearly lists the material or authorization it needs from the user (e.g. redacted logs, a packet capture, a reproducible device, authorization for temporary instrumentation)"
    - "The agent does not terminate the skill on the grounds that \"an automated loop can't be established\"; HITL is treated as a legitimate path and the diagnosis keeps moving forward"
    - "The response is written primarily in Japanese (kanji/hiragana/katakana), not in English or Chinese — matching the Language Policy's rule of answering in the language of the user's message"
  pass_threshold: 0.75
