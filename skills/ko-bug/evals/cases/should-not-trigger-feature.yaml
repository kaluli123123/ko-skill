id: should-not-trigger-feature
title: "A plain feature request should not trigger the ko-bug protocol"
description: |
  Locks in fix 1 from the audit (the "not for new features" boundary in the frontmatter
  description): the request carries no failure symptom at all, so the agent should implement
  the feature directly and must not layer on bugfix-protocol scaffolding (feedback loop /
  hypothesis list / analysis confirmation gate).
  Uses a Chinese-language request to exercise the Language Policy: the response is expected
  to come back in Chinese, not switch to English.

input:
  prompt: |
    给 todo.py 加一个 `--json` 参数：`python3 todo.py list --json` 时，把待办列表输出成一个
    JSON 字符串数组（数组元素就是待办事项文本本身，不要包成对象），例如
    `["买牛奶", "写周报"]`；默认（不带 `--json`）仍保持现在的纯文本输出。

context:
  files:
    "todo.py": |
      import sys

      TODOS = ["买牛奶", "写周报", "预约牙医"]


      def main(argv):
          if not argv or argv[0] != "list":
              print("用法: todo.py list")
              return 2
          for i, item in enumerate(TODOS, 1):
              print(f"{i}. {item}")
          return 0


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))

constraints:
  timeout_seconds: 300
  max_turns: 15

expect:
  must_not_contain:                  # none of the bugfix-protocol's signature terms should appear
    - "反馈循环"
    - "分析确认门"
    - "可证伪"
    - "最小复现"
  file_contains:
    - path: "todo.py"
      content: "--json"

judge:
  type: rule_based
  success:
    - files_exist:
        - "todo.py"
    - output_contains:
        not: ["阶段 2", "RED", "GREEN", "根因"]
    - output_matches:                # response should be Chinese script, not Japanese kana
        all: ["\\p{Han}"]
        not: ["\\p{Hiragana}", "\\p{Katakana}"]
